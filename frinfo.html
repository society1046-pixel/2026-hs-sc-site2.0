<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hssc - 자유게시판</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #7BA4DB;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #EEEEEE;
            --text-main: #333333;
            --text-sub: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .board-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--text-main); }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #DDD;
            border-radius: 6px 0 0 6px;
            outline: none;
        }
        
        .search-box button {
            padding: 10px 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
        }

        .btn-write {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: #FFF;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        .board-list { list-style: none; border-top: 2px solid var(--text-main); }
        
        .board-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .board-item:hover { background: #F1F5F9; }
        
        .board-title { font-size: 16px; font-weight: 500; flex: 1; }
        .board-meta { font-size: 13px; color: var(--text-sub); display: flex; gap: 15px; width: 220px; justify-content: flex-end;}
        .board-file-icon { color: var(--primary-color); margin-left: 5px; }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 5px;
        }
        .page-btn {
            padding: 5px 10px;
            border: 1px solid #DDD;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .page-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 모달 공통 스타일 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 6px; }
        textarea.form-control { resize: vertical; min-height: 200px; }
        
        /* 익명 체크박스 스타일 */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { padding: 10px 20px; background: #94A3B8; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-submit { padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        .btn-edit { padding: 10px 20px; background: #F59E0B; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-delete { padding: 10px 20px; background: #EF4444; color: white; border: none; border-radius: 6px; cursor: pointer; }

        .view-meta { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .view-body { min-height: 150px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
        .file-preview-area { margin-top: 20px; padding: 15px; background: #F8FAFC; border-radius: 8px; }
        .file-preview-area img { max-width: 100%; border-radius: 4px; }
        .file-preview-area a { color: var(--primary-color); text-decoration: none; font-weight: 500; display: inline-block; margin-top: 10px;}
        
        .write-preview-container {
            margin-top: 10px;
            padding: 10px;
            background: #F8FAFC;
            border: 1px dashed #CBD5E1;
            border-radius: 6px;
            text-align: center;
        }
        .write-preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            object-fit: contain;
        }

        .admin-tag {
            color: #EF4444;
            font-size: 11px;
            font-weight: bold;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<script src="head.js"></script>

<main>
    <div class="board-container">
        <h2 class="page-title"><i class="fa-solid fa-comments" style="color: var(--primary-color);"></i> 자유게시판</h2>
        
        <div class="board-header">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="검색어를 입력하세요">
                <button onclick="searchPosts()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <button id="btnWrite" class="btn-write" onclick="openWriteModal()">글쓰기</button>
        </div>

        <ul class="board-list" id="boardList">
        </ul>

        <div class="pagination" id="pagination">
        </div>
    </div>
</main>

<!-- 작성/수정 모달 -->
<div class="modal-overlay" id="writeModal">
    <div class="modal-content">
        <h3 class="modal-title" id="writeModalTitle">게시글 작성</h3>
        <div class="form-group">
            <input type="text" id="writeTitle" class="form-control" placeholder="제목을 입력하세요">
        </div>
        <div class="form-group">
            <textarea id="writeContent" class="form-control" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="form-group">
            <label class="checkbox-group">
                <input type="checkbox" id="writeAnonymous">
                <span>익명으로 작성하기</span>
            </label>
        </div>
        <div class="form-group">
            <label style="font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 5px;">첨부파일 <span id="currentFileName" style="color:var(--primary-color); margin-left: 5px; font-weight: 500;"></span></label>
            <input type="file" id="writeFile" class="form-control" onchange="handleFileChange()">
            <div id="writePreviewArea" class="write-preview-container" style="display: none;"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">취소</button>
            <button class="btn-submit" onclick="submitPost()" id="btnSubmit">등록하기</button>
        </div>
    </div>
</div>

<!-- 상세 보기 모달 -->
<div class="modal-overlay" id="viewModal">
    <div class="modal-content">
        <h3 class="modal-title" id="viewTitle"></h3>
        <div class="view-meta" id="viewMeta"></div>
        <div class="view-body" id="viewContent"></div>
        <div class="file-preview-area" id="filePreviewArea" style="display: none;"></div>
        <div class="modal-actions" style="justify-content: space-between;">
            <div id="authorActions" style="display: none; gap: 10px;">
                <button class="btn-edit" onclick="openEditModal()">수정</button>
                <button class="btn-delete" onclick="deletePost()">삭제</button>
            </div>
            <button class="btn-cancel" onclick="closeModals()">닫기</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCWPYuQeihfDgp5tVlrObBVRs2UZDlTkks",
        authDomain: "hyeongsok-student-counci-e6115.firebaseapp.com",
        projectId: "hyeongsok-student-counci-e6115",
        storageBucket: "hyeongsok-student-counci-e6115.firebasestorage.app",
        messagingSenderId: "847440892138",
        appId: "1:847440892138:web:152021aaaf5f330b2d0793",
        measurementId: "G-F40YFFMGWE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allPosts = []; 
    let filteredPosts = []; 
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentUser = null;
    
    let currentViewItem = null; 
    let currentEditId = null;

    window.onload = async () => {
        if (checkAuth()) {
            await loadPosts();
        }
    };

    // 로그인 확인 및 필수 제한
    function checkAuth() {
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session) {
            alert("자유게시판은 로그인 후 이용할 수 있습니다.");
            location.href = 'login.html';
            return false;
        }
        currentUser = session;
        document.getElementById('btnWrite').style.display = 'block';
        return true;
    }

    // 관리자인 경우 익명글 작성자 원본 확인 가능하도록 처리
    function getDisplayAuthorName(item) {
        if (item.isAnonymous) {
            if (currentUser && currentUser.role === 'admin') {
                return `익명 <span class="admin-tag">(${item.authorName || '미상'})</span>`;
            }
            return '익명';
        }
        return item.authorName || '익명';
    }

    function isOwnerOrAdmin(item) {
        if (!currentUser || !item) return false;
        return currentUser.id === item.authorId || currentUser.role === 'admin';
    }

    async function loadPosts() {
        try {
            const q = query(collection(db, "freeboard"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            allPosts = [];
            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                data.id = docSnap.id;
                
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    data.dateStr = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
                } else {
                    data.dateStr = "방금 전";
                }
                allPosts.push(data);
            });
            
            filteredPosts = [...allPosts];
            renderPage(1);
        } catch (error) {
            console.error("데이터 로드 에러:", error);
        }
    }

    window.renderPage = function(page) {
        currentPage = page;
        const listEl = document.getElementById('boardList');
        listEl.innerHTML = '';

        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredPosts.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            listEl.innerHTML = '<li style="text-align:center; padding: 20px; color: #94A3B8;">등록된 게시글이 없습니다.</li>';
            renderPagination();
            return;
        }

        pageData.forEach(item => {
            const li = document.createElement('li');
            li.className = 'board-item';
            li.onclick = () => openViewModal(item);
            
            let fileIcon = item.fileUrl ? '<i class="fa-solid fa-paperclip board-file-icon"></i>' : '';
            let authorText = getDisplayAuthorName(item);

            li.innerHTML = `
                <div class="board-title">${item.title} ${fileIcon}</div>
                <div class="board-meta">
                    <span>${authorText}</span>
                    <span>${item.dateStr}</span>
                </div>
            `;
            listEl.appendChild(li);
        });

        renderPagination();
    }

    function renderPagination() {
        const paginationEl = document.getElementById('pagination');
        paginationEl.innerHTML = '';
        
        const totalPages = Math.ceil(filteredPosts.length / itemsPerPage);
        
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => renderPage(i);
            paginationEl.appendChild(btn);
        }
    }

    window.searchPosts = function() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        filteredPosts = allPosts.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.content.toLowerCase().includes(keyword)
        );
        renderPage(1);
    }

    window.openWriteModal = function() {
        currentEditId = null;
        document.getElementById('writeModalTitle').innerText = '게시글 작성';
        document.getElementById('writeTitle').value = '';
        document.getElementById('writeContent').value = '';
        document.getElementById('writeAnonymous').checked = false;
        document.getElementById('writeFile').value = '';
        document.getElementById('currentFileName').innerText = '';
        
        const previewArea = document.getElementById('writePreviewArea');
        previewArea.innerHTML = '';
        previewArea.style.display = 'none';

        document.getElementById('btnSubmit').innerText = '등록하기';
        document.getElementById('writeModal').style.display = 'flex';
    }

    window.openEditModal = function() {
        if (!currentViewItem) return;
        
        if (!isOwnerOrAdmin(currentViewItem)) {
            alert("수정 권한이 없습니다.");
            return;
        }
        
        currentEditId = currentViewItem.id;
        document.getElementById('writeModalTitle').innerText = '게시글 수정';
        document.getElementById('writeTitle').value = currentViewItem.title;
        document.getElementById('writeContent').value = currentViewItem.content;
        document.getElementById('writeAnonymous').checked = !!currentViewItem.isAnonymous;
        document.getElementById('writeFile').value = '';
        document.getElementById('currentFileName').innerText = currentViewItem.fileName ? `(기존 첨부파일: ${currentViewItem.fileName})` : '';
        
        const previewArea = document.getElementById('writePreviewArea');
        if (currentViewItem.fileUrl) {
            previewArea.style.display = 'block';
            if (currentViewItem.fileType && currentViewItem.fileType.startsWith('image/')) {
                previewArea.innerHTML = `<p style="font-size:12px; color:#64748B; margin-bottom:5px;">기존 이미지 미리보기</p><img src="${currentViewItem.fileUrl}" alt="기존 이미지">`;
            } else {
                previewArea.innerHTML = `<div style="font-size:13px; color:#64748B;"><i class="fa-solid fa-file"></i> 기존 파일: ${currentViewItem.fileName || '첨부파일'}</div>`;
            }
        } else {
            previewArea.innerHTML = '';
            previewArea.style.display = 'none';
        }

        document.getElementById('btnSubmit').innerText = '수정하기';
        document.getElementById('viewModal').style.display = 'none';
        document.getElementById('writeModal').style.display = 'flex';
    }

    window.handleFileChange = function() {
        const fileInput = document.getElementById('writeFile');
        const fileNameDisplay = document.getElementById('currentFileName');
        const previewArea = document.getElementById('writePreviewArea');
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const maxSize = 10 * 1024 * 1024;
            
            if (file.size > maxSize) {
                alert("파일 크기는 10MB를 초과할 수 없습니다.");
                fileInput.value = ""; 
                fileNameDisplay.innerText = "";
                previewArea.innerHTML = "";
                previewArea.style.display = "none";
                return;
            }
            
            let sizeStr = file.size < 1024 * 1024 
                ? (file.size / 1024).toFixed(1) + " KB" 
                : (file.size / (1024 * 1024)).toFixed(1) + " MB";
            
            fileNameDisplay.innerText = `[${file.name} / ${sizeStr}]`;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewArea.innerHTML = `<img src="${e.target.result}" alt="미리보기 이미지">`;
                    previewArea.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                previewArea.innerHTML = `<div style="font-size:13px; color:#64748B;"><i class="fa-solid fa-file"></i> ${file.name}</div>`;
                previewArea.style.display = 'block';
            }
        } else {
            fileNameDisplay.innerText = "";
            previewArea.innerHTML = "";
            previewArea.style.display = "none";
        }
    }

    window.deletePost = async function() {
        if (!currentViewItem) return;
        
        if (!isOwnerOrAdmin(currentViewItem)) {
            alert("삭제 권한이 없습니다.");
            return;
        }
        
        if (confirm("정말 이 게시글을 삭제하시겠습니까?")) {
            try {
                await deleteDoc(doc(db, "freeboard", currentViewItem.id));
                alert("삭제되었습니다.");
                closeModals();
                await loadPosts();
            } catch (error) {
                console.error("삭제 중 오류:", error);
                alert("삭제 중 오류가 발생했습니다.");
            }
        }
    }

    window.closeModals = function() {
        document.getElementById('writeModal').style.display = 'none';
        document.getElementById('viewModal').style.display = 'none';
    }

    window.openViewModal = function(item) {
        currentViewItem = item;
        
        document.getElementById('viewTitle').innerText = item.title;
        
        const authorText = getDisplayAuthorName(item);
        document.getElementById('viewMeta').innerHTML = `작성자: ${authorText} | 작성일: ${item.dateStr}`;
        document.getElementById('viewContent').innerText = item.content;
        
        const previewArea = document.getElementById('filePreviewArea');
        if (item.fileUrl) {
            previewArea.style.display = 'block';
            previewArea.innerHTML = '<p style="font-size:13px; margin-bottom:10px; color:#64748B;"><i class="fa-solid fa-paperclip"></i> 첨부파일</p>';
            
            if (item.fileType && item.fileType.startsWith('image/')) {
                previewArea.innerHTML += `<img src="${item.fileUrl}" alt="첨부 이미지">`;
            } else {
                previewArea.innerHTML += `<a href="${item.fileUrl}" target="_blank" download><i class="fa-solid fa-download"></i> ${item.fileName || '파일 다운로드'}</a>`;
            }
        } else {
            previewArea.style.display = 'none';
        }

        const authorActions = document.getElementById('authorActions');
        if (isOwnerOrAdmin(item)) {
            authorActions.style.display = 'flex';
        } else {
            authorActions.style.display = 'none';
        }

        document.getElementById('viewModal').style.display = 'flex';
    }

    async function uploadToCloudinary(file) {
        const url = 'https://api.cloudinary.com/v1_1/dswystlen/auto/upload';
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'hssc2site');

        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || '업로드 실패');
            }
            
            return data.secure_url;
        } catch (error) {
            console.error("클라우디너리 업로드 에러:", error);
            throw error;
        }
    }

    window.submitPost = async function() {
        const title = document.getElementById('writeTitle').value.trim();
        const content = document.getElementById('writeContent').value.trim();
        const isAnonymous = document.getElementById('writeAnonymous').checked;
        const fileInput = document.getElementById('writeFile');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!title || !content) {
            alert("제목과 내용을 모두 입력해주세요.");
            return;
        }

        if (currentEditId && currentViewItem && !isOwnerOrAdmin(currentViewItem)) {
            alert("수정 권한이 없습니다.");
            return;
        }

        try {
            btnSubmit.innerText = currentEditId ? "수정 중..." : "업로드 중...";
            btnSubmit.disabled = true;

            let fileUrl = currentEditId ? currentViewItem.fileUrl : null;
            let fileType = currentEditId ? currentViewItem.fileType : null;
            let fileName = currentEditId ? currentViewItem.fileName : null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileUrl = await uploadToCloudinary(file);
                fileType = file.type;
                fileName = file.name;
            }

            if (currentEditId) {
                const docRef = doc(db, "freeboard", currentEditId);
                await updateDoc(docRef, {
                    title: title,
                    content: content,
                    isAnonymous: isAnonymous,
                    fileUrl: fileUrl,
                    fileType: fileType,
                    fileName: fileName
                });
                alert("게시글이 수정되었습니다.");
            } else {
                await addDoc(collection(db, "freeboard"), {
                    title: title,
                    content: content,
                    authorId: currentUser.id,
                    authorName: currentUser.name || currentUser.id,
                    isAnonymous: isAnonymous,
                    createdAt: serverTimestamp(),
                    fileUrl: fileUrl,
                    fileType: fileType,
                    fileName: fileName
                });
                alert("게시글이 등록되었습니다.");
            }

            closeModals();
            await loadPosts();

        } catch (error) {
            console.error("글 저장 에러:", error);
            alert("저장 중 오류가 발생했습니다: " + error.message);
        } finally {
            btnSubmit.innerText = currentEditId ? "수정하기" : "등록하기";
            btnSubmit.disabled = false;
        }
    }
</script>

</body>
</html>
