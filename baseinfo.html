<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hssc - 사이트 기본 정보 설정</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #7BA4DB;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #EEEEEE;
            --text-main: #333333;
            --text-sub: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .board-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 30px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }

        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .form-control { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #DDD; 
            border-radius: 6px; 
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary-color);
        }
        
        .btn-submit { 
            width: 100%;
            padding: 15px; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px;
            font-weight: 700;
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #6a93c9;
        }
        .btn-submit:disabled {
            background-color: #94A3B8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<script src="head.js"></script>

<main>
    <div class="board-container">
        <h2 class="page-title"><i class="fa-solid fa-gear" style="color: var(--primary-color);"></i> 사이트 기본 정보 설정</h2>
        
        <div id="infoForm">
            <div class="form-group">
                <label for="operatingHours">운영일시</label>
                <input type="text" id="operatingHours" class="form-control" placeholder="예: 평일 09:00 ~ 18:00 (주말 휴무)">
            </div>

            <div class="form-group">
                <label for="department">운영부서</label>
                <input type="text" id="department" class="form-control" placeholder="예: 학생회 총무부">
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address" class="form-control" placeholder="예: 충청북도 청주시 흥덕구 00학교 학생회실">
            </div>

            <button class="btn-submit" id="btnSubmit" onclick="saveInfo()">정보 저장하기</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyCWPYuQeihfDgp5tVlrObBVRs2UZDlTkks",
        authDomain: "hyeongsok-student-counci-e6115.firebaseapp.com",
        projectId: "hyeongsok-student-counci-e6115",
        storageBucket: "hyeongsok-student-counci-e6115.firebasestorage.app",
        messagingSenderId: "847440892138",
        appId: "1:847440892138:web:152021aaaf5f330b2d0793",
        measurementId: "G-F40YFFMGWE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentUser = null;

    window.onload = async () => {
        if (!checkAuth()) return; // 권한이 없으면 진행 중단
        await loadInfo();
    };

    // 권한 체크 (관리자급만 접근 가능하도록 설정)
    function checkAuth() {
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (session) {
            currentUser = session;
            
            const allowedRoles = ['admin', 'teacher', 'president', 'vice_president']; // 설정 페이지 접근 가능 권한
            const hasPermission = allowedRoles.includes(currentUser.role);
            
            if (!hasPermission) {
                alert("기본 정보 설정 페이지에 접근할 권한이 없습니다.");
                // 권한이 없을 경우 메인 페이지나 이전 페이지로 리다이렉트
                window.location.href = "index.html"; 
                return false;
            }
            return true;
        } else {
            alert("로그인이 필요합니다.");
            window.location.href = "index.html";
            return false;
        }
    }

    // 파이어베이스에서 기존 정보 불러오기
    async function loadInfo() {
        try {
            // "settings" 컬렉션의 "baseInfo" 문서를 참조
            const docRef = doc(db, "settings", "baseInfo");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('operatingHours').value = data.operatingHours || '';
                document.getElementById('department').value = data.department || '';
                document.getElementById('address').value = data.address || '';
            }
        } catch (error) {
            console.error("데이터 로드 에러:", error);
            alert("정보를 불러오는 중 오류가 발생했습니다.");
        }
    }

    // 입력한 정보 파이어베이스에 저장하기
    window.saveInfo = async function() {
        const operatingHours = document.getElementById('operatingHours').value.trim();
        const department = document.getElementById('department').value.trim();
        const address = document.getElementById('address').value.trim();
        const btnSubmit = document.getElementById('btnSubmit');

        if (!operatingHours || !department || !address) {
            alert("모든 항목을 입력해주세요.");
            return;
        }

        try {
            btnSubmit.innerText = "저장 중...";
            btnSubmit.disabled = true;

            // "settings" 컬렉션의 "baseInfo" 문서에 데이터 저장 (덮어쓰기)
            const docRef = doc(db, "settings", "baseInfo");
            await setDoc(docRef, {
                operatingHours: operatingHours,
                department: department,
                address: address,
                updatedBy: currentUser.name,
                updatedAt: serverTimestamp()
            }, { merge: true }); // merge: true를 쓰면 기존 데이터 중 명시하지 않은 필드는 유지됨

            alert("사이트 기본 정보가 성공적으로 저장되었습니다.");

        } catch (error) {
            console.error("정보 저장 에러:", error);
            alert("저장 중 오류가 발생했습니다: " + error.message);
        } finally {
            btnSubmit.innerText = "정보 저장하기";
            btnSubmit.disabled = false;
        }
    }
</script>

</body>
</html>
