<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hssc - 자습/멘토멘티 관리자 설정</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #7BA4DB;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #EEEEEE;
            --text-main: #333333;
            --text-sub: #64748B;
            --danger-color: #EF4444;
            --success-color: #10B981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 25px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 15px; color: var(--text-main); display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #DDD; border-radius: 6px; outline: none; transition: 0.2s; font-size: 14px; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(123, 164, 219, 0.2); }

        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; }
        .checkbox-label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
        .checkbox-label input { width: 16px; height: 16px; cursor: pointer; }

        .time-row { display: flex; gap: 10px; align-items: center; }

        .btn-primary { padding: 10px 18px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        
        .btn-danger { padding: 6px 10px; background-color: var(--danger-color); color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn-danger:hover { background-color: #DC2626; }

        .btn-refresh { padding: 6px 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* 등록 그리드 */
        .force-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .force-grid { grid-template-columns: 1fr; } }

        /* 신청 명단 테이블 */
        .list-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: center; }
        .list-table th { background-color: #F8FAFC; padding: 10px; border-top: 2px solid var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 500; }
        .list-table td { padding: 10px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        
        .badge { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; color: white; }
        .badge-homebase { background-color: #10B981; }
        .badge-mentor { background-color: #F59E0B; }
        .empty-msg { text-align: center; padding: 20px; color: var(--text-sub); font-size: 13px; }
        .day-header { margin-top: 20px; font-size: 15px; color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; font-weight: 700; }
        .verify-text { font-size: 12px; font-weight: 500; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<script src="head.js"></script>

<main>
    <h2 class="page-title"><i class="fa-solid fa-sliders" style="color: var(--primary-color);"></i> 자습/멘토멘티 관리자 설정</h2>

    <!-- 1. 신청 시간 및 요일 설정 -->
    <div class="admin-card">
        <div class="section-title"><i class="fa-solid fa-clock"></i> 1. 신청 가능 요일 및 시간 설정</div>
        
        <div class="form-group">
            <label>신청 오픈 요일 선택</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="월"> 월요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="화"> 화요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="수"> 수요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="목"> 목요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="금"> 금요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="토"> 토요일</label>
                <label class="checkbox-label"><input type="checkbox" name="openDay" value="일"> 일요일</label>
            </div>
        </div>

        <div class="form-group">
            <label>신청 허용 시간 (시작 ~ 종료)</label>
            <div class="time-row">
                <input type="time" id="startTime" class="form-control" style="width: 150px;">
                <span>~</span>
                <input type="time" id="endTime" class="form-control" style="width: 150px;">
            </div>
        </div>

        <button class="btn-primary" onclick="savePeriodSettings()"><i class="fa-solid fa-floppy-disk"></i> 설정 저장하기</button>
    </div>

    <!-- 2. 강제 신청 등록 (수동 추가) -->
    <div class="admin-card">
        <div class="section-title"><i class="fa-solid fa-user-plus"></i> 2. 신청 내역 수동 등록 (강제 추가)</div>
        
        <div class="force-grid">
            <div class="form-group">
                <label>참여 날짜 선택</label>
                <select id="forceDate" class="form-control"></select>
            </div>
            
            <div class="form-group">
                <label>신청 학생 학번 (예: 20101)</label>
                <input type="text" id="forceStudentNum" class="form-control" placeholder="학번 입력 후 바깥 클릭" onblur="verifyForceStudent()">
                <span id="forceStudentMsg" class="verify-text"></span>
            </div>
        </div>

        <div class="force-grid">
            <!-- 1교시 -->
            <div class="form-group" style="background:#F8FAFC; padding:12px; border-radius:6px;">
                <label><b>1교시 활동</b></label>
                <select id="forceSlot1" class="form-control" onchange="toggleForceMentee(1)">
                    <option value="none">신청 안 함</option>
                    <option value="homebase">홈베이스</option>
                    <option value="mentor">멘토멘티</option>
                </select>
                <div id="forceMenteeBox1" style="display:none; margin-top:8px;">
                    <input type="text" id="forceMenteeNum1" class="form-control" placeholder="멘티 학번 입력" onblur="verifyForceMentee(1)">
                    <span id="forceMenteeMsg1" class="verify-text"></span>
                </div>
            </div>

            <!-- 2교시 -->
            <div class="form-group" style="background:#F8FAFC; padding:12px; border-radius:6px;">
                <label><b>2교시 활동</b></label>
                <select id="forceSlot2" class="form-control" onchange="toggleForceMentee(2)">
                    <option value="none">신청 안 함</option>
                    <option value="homebase">홈베이스</option>
                    <option value="mentor">멘토멘티</option>
                </select>
                <div id="forceMenteeBox2" style="display:none; margin-top:8px;">
                    <input type="text" id="forceMenteeNum2" class="form-control" placeholder="멘티 학번 입력" onblur="verifyForceMentee(2)">
                    <span id="forceMenteeMsg2" class="verify-text"></span>
                </div>
            </div>
        </div>

        <button class="btn-primary" onclick="submitForceAdd()" style="width:100%; margin-top:10px;"><i class="fa-solid fa-plus"></i> 수동 등록 완료</button>
    </div>

    <!-- 3. 명단 조회 및 삭제 관리 -->
    <div class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
            <div class="section-title" style="border:none; padding:0; margin:0;"><i class="fa-solid fa-list-check"></i> 3. 주간 신청 내역 관리 (삭제)</div>
            <button class="btn-refresh" onclick="fetchAdminList()"><i class="fa-solid fa-rotate-right"></i> 새로고침</button>
        </div>

        <div id="admin-list-container">
            <div class="empty-msg">데이터를 불러오는 중입니다... ⏳</div>
        </div>
    </div>
</main>

<script>
    window.weekDatesList = [];

    function setupDateDropdowns() {
        const forceDateSelect = document.getElementById('forceDate');
        let optionsHtml = '<option value="">선택하세요</option>';
        
        let targetDate = new Date();
        const dayOfWeek = targetDate.getDay(); 
        
        if (dayOfWeek === 0) targetDate.setDate(targetDate.getDate() + 1); 
        else if (dayOfWeek === 6) targetDate.setDate(targetDate.getDate() + 2);
        else targetDate.setDate(targetDate.getDate() - (dayOfWeek - 1));
        
        const dayNames = ['월', '화', '수', '목', '금'];
        
        for(let i = 0; i < 5; i++) {
            if (i !== 2) { 
                const d = new Date(targetDate);
                d.setDate(targetDate.getDate() + i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateString = `${yyyy}${mm}${dd}`; 
                const displayString = `${dayNames[i]}요일 (${mm}/${dd})`; 
                window.weekDatesList.push({ date: dateString, day: dayNames[i], display: displayString }); 
                optionsHtml += `<option value="${dateString}|${dayNames[i]}">${displayString}</option>`;
            }
        }
        forceDateSelect.innerHTML = optionsHtml;
    }
    setupDateDropdowns();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCWPYuQeihfDgp5tVlrObBVRs2UZDlTkks",
        authDomain: "hyeongsok-student-counci-e6115.firebaseapp.com",
        projectId: "hyeongsok-student-counci-e6115",
        storageBucket: "hyeongsok-student-counci-e6115.firebasestorage.app",
        messagingSenderId: "847440892138",
        appId: "1:847440892138:web:152021aaaf5f330b2d0793",
        measurementId: "G-F40YFFMGWE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==========================================
    // [선생님 / 관리자 권한 확인]
    // ==========================================
    const userSession = JSON.parse(localStorage.getItem('userSession') || '{}');
    window.currentUserId = userSession.id || '';
    window.cRole = userSession.role || '';

    const isAdmin = (window.cRole === 'admin');
    const isTeacher = (window.cRole === 'teacher' || Number(window.cRole) >= 45);

    if (!window.currentUserId || (!isAdmin && !isTeacher)) {
        alert("선생님 및 관리자 전용 접근 제한 페이지입니다.");
        window.location.href = "index.html";
    }

    // 임시 저장용 객체
    window.forceApplicant = { id: '', name: '', studentNumber: '' };
    window.forceMentee = { 1: { id: '', name: '' }, 2: { id: '', name: '' } };

    // ==========================================
    // 1. 기간 및 요일 설정 불러오기 및 저장
    // ==========================================
    async function loadPeriodSettings() {
        try {
            const snap = await getDoc(doc(db, "system_settings", "app_period"));
            if (snap.exists()) {
                const data = snap.data();
                if (data.openDays) {
                    document.querySelectorAll('input[name="openDay"]').forEach(cb => {
                        cb.checked = data.openDays.includes(cb.value);
                    });
                }
                if (data.startTime) document.getElementById('startTime').value = data.startTime;
                if (data.endTime) document.getElementById('endTime').value = data.endTime;
            }
        } catch (error) {
            console.error("설정 로드 실패:", error);
        }
    }
    loadPeriodSettings();

    window.savePeriodSettings = async function() {
        const checkedDays = Array.from(document.querySelectorAll('input[name="openDay"]:checked')).map(cb => cb.value);
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;

        try {
            await setDoc(doc(db, "system_settings", "app_period"), {
                openDays: checkedDays,
                startTime: startTime,
                endTime: endTime,
                updatedAt: new Date().toISOString()
            });
            alert("신청 시간 및 요일 설정이 정상적으로 저장되었습니다!");
        } catch (error) {
            console.error(error);
            alert("설정 저장 중 오류가 발생했습니다.");
        }
    };

    // ==========================================
    // 2. 수동 등록 관련 사용자 검증
    // ==========================================
    window.toggleForceMentee = function(slot) {
        const type = document.getElementById(`forceSlot${slot}`).value;
        const box = document.getElementById(`forceMenteeBox${slot}`);
        if(type === 'mentor') {
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
            document.getElementById(`forceMenteeNum${slot}`).value = '';
            document.getElementById(`forceMenteeMsg${slot}`).innerText = '';
            window.forceMentee[slot] = { id: '', name: '' };
        }
    };

    window.verifyForceStudent = async function() {
        const num = document.getElementById('forceStudentNum').value.trim();
        const msg = document.getElementById('forceStudentMsg');
        if(!num) { msg.innerText = ''; return; }

        msg.innerText = "학생 조회 중... ⏳";
        msg.style.color = "#64748B";

        try {
            const q = query(collection(db, "users"), where("studentNumber", "==", num));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const userData = snap.docs[0].data();
                const name = userData.userName || userData.name || userData.nmae;
                msg.innerText = `✅ 확인됨: ${name} (${num})`;
                msg.style.color = "#10B981";
                window.forceApplicant = { id: snap.docs[0].id, name: name, studentNumber: num };
            } else {
                msg.innerText = "❌ 일치하는 학번의 유저가 없습니다.";
                msg.style.color = "#EF4444";
                window.forceApplicant = { id: '', name: '', studentNumber: '' };
            }
        } catch(e) {
            msg.innerText = "조회 실패";
            msg.style.color = "#EF4444";
        }
    };

    window.verifyForceMentee = async function(slot) {
        const num = document.getElementById(`forceMenteeNum${slot}`).value.trim();
        const msg = document.getElementById(`forceMenteeMsg${slot}`);
        if(!num) { msg.innerText = ''; return; }

        msg.innerText = "멘티 조회 중... ⏳";
        msg.style.color = "#64748B";

        try {
            const q = query(collection(db, "users"), where("studentNumber", "==", num));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const userData = snap.docs[0].data();
                const name = userData.userName || userData.name || userData.nmae;
                msg.innerText = `✅ 확인됨: ${name} (${num})`;
                msg.style.color = "#10B981";
                window.forceMentee[slot] = { id: snap.docs[0].id, name: name };
            } else {
                msg.innerText = "❌ 일치하는 학번의 멘티가 없습니다.";
                msg.style.color = "#EF4444";
                window.forceMentee[slot] = { id: '', name: '' };
            }
        } catch(e) {
            msg.innerText = "조회 실패";
            msg.style.color = "#EF4444";
        }
    };

    window.submitForceAdd = async function() {
        const dateVal = document.getElementById('forceDate').value;
        if(!dateVal) return alert("참여 날짜를 선택해주세요.");
        if(!window.forceApplicant.id) return alert("신청 학생 학번을 정확히 확인해주세요.");

        const [yyyyMMdd, dayName] = dateVal.split('|');
        const slot1Type = document.getElementById('forceSlot1').value;
        const slot2Type = document.getElementById('forceSlot2').value;

        if(slot1Type === 'none' && slot2Type === 'none') return alert("1교시 또는 2교시 중 하나를 선택해야 합니다.");
        if(slot1Type === 'mentor' && !window.forceMentee[1].name) return alert("1교시 멘티 정보를 확인해주세요.");
        if(slot2Type === 'mentor' && !window.forceMentee[2].name) return alert("2교시 멘티 정보를 확인해주세요.");

        const docId = `${yyyyMMdd}_${dayName}_${window.forceApplicant.id}`;
        
        let payload = {
            id: window.forceApplicant.id,
            name: window.forceApplicant.name,
            studentNumber: window.forceApplicant.studentNumber,
            applyDay: dayName,
            applyDate: yyyyMMdd,
            timestamp: new Date().toISOString()
        };

        if(slot1Type !== 'none') {
            payload.slot1_type = slot1Type;
            if(slot1Type === 'mentor') {
                payload.slot1_partnerId = window.forceMentee[1].id;
                payload.slot1_partnerName = window.forceMentee[1].name;
            }
        }

        if(slot2Type !== 'none') {
            payload.slot2_type = slot2Type;
            if(slot2Type === 'mentor') {
                payload.slot2_partnerId = window.forceMentee[2].id;
                payload.slot2_partnerName = window.forceMentee[2].name;
            }
        }

        try {
            await setDoc(doc(db, "study_applications", docId), payload);
            alert("신청 내역이 성공적으로 수동 등록되었습니다!");
            window.fetchAdminList();
        } catch(e) {
            console.error(e);
            alert("수동 등록 중 오류가 발생했습니다.");
        }
    };

    // ==========================================
    // 3. 주간 신청 명단 관리 (조회 및 삭제)
    // ==========================================
    window.deleteAdminRecord = async function(docId) {
        if(!confirm("해당 신청 내역을 강제 삭제하시겠습니까?")) return;
        try {
            await deleteDoc(doc(db, "study_applications", docId));
            alert("삭제되었습니다.");
            window.fetchAdminList();
        } catch (e) {
            console.error(e);
            alert("삭제 중 오류가 발생했습니다.");
        }
    };

    window.fetchAdminList = async function() {
        const container = document.getElementById('admin-list-container');
        container.innerHTML = '<div class="empty-msg">주간 목록을 불러오는 중입니다... ⏳</div>';

        try {
            const weekDates = window.weekDatesList.map(info => info.date);
            if(weekDates.length === 0) {
                container.innerHTML = '<div class="empty-msg">등록된 주간 날짜가 없습니다.</div>';
                return;
            }

            const q = query(collection(db, "study_applications"), where("applyDate", "in", weekDates));
            const snap = await getDocs(q);

            const groupedData = {};
            window.weekDatesList.forEach(info => {
                groupedData[info.date] = { display: info.display, records: [] };
            });

            if(!snap.empty) {
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if(groupedData[data.applyDate]) {
                        data._docId = docSnap.id;
                        groupedData[data.applyDate].records.push(data);
                    }
                });
            }

            let totalHtml = '';

            window.weekDatesList.forEach(info => {
                const dayData = groupedData[info.date];
                totalHtml += `<div class="day-header"><i class="fa-regular fa-calendar"></i> ${dayData.display}</div>`;

                if(dayData.records.length === 0) {
                    totalHtml += `<div class="empty-msg" style="padding:10px;">신청 내역이 없습니다.</div>`;
                } else {
                    let tableHtml = `
                        <table class="list-table">
                            <thead>
                                <tr>
                                    <th>이름 (학번)</th>
                                    <th>1교시</th>
                                    <th>2교시</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    dayData.records.sort((a,b) => a.name.localeCompare(b.name));

                    dayData.records.forEach(data => {
                        let slot1_html = '<span style="color:#94A3B8;">-</span>';
                        if(data.slot1_type === 'homebase') slot1_html = '<span class="badge badge-homebase">홈베이스</span>';
                        else if(data.slot1_type === 'mentor') slot1_html = `<span class="badge badge-mentor">멘토멘티</span> <span style="font-size:11px; color:#64748B;">(w/ ${data.slot1_partnerName})</span>`;

                        let slot2_html = '<span style="color:#94A3B8;">-</span>';
                        if(data.slot2_type === 'homebase') slot2_html = '<span class="badge badge-homebase">홈베이스</span>';
                        else if(data.slot2_type === 'mentor') slot2_html = `<span class="badge badge-mentor">멘토멘티</span> <span style="font-size:11px; color:#64748B;">(w/ ${data.slot2_partnerName})</span>`;

                        let dispStudentNum = data.studentNumber || data.id;

                        tableHtml += `
                            <tr>
                                <td style="font-weight:500;">${data.name} <span style="font-size:11px; color:#64748B;">(${dispStudentNum})</span></td>
                                <td>${slot1_html}</td>
                                <td>${slot2_html}</td>
                                <td><button class="btn-danger" onclick="deleteAdminRecord('${data._docId}')"><i class="fa-solid fa-trash"></i> 삭제</button></td>
                            </tr>
                        `;
                    });

                    tableHtml += `</tbody></table>`;
                    totalHtml += tableHtml;
                }
            });

            container.innerHTML = totalHtml;

        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="empty-msg" style="color:#EF4444;">목록 조회 오류 발생</div>';
        }
    };

    // 초기 명단 불러오기
    window.fetchAdminList();
</script>

</body>
</html>
